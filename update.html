<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>正在更新 Sweet Home</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: #edf5e8; color: #394438; }
      main { width: min(84vw, 320px); text-align: center; }
      .flower { font-size: 48px; }
      h1 { margin: 12px 0 8px; font-size: 22px; }
      p { margin: 0; color: rgba(57, 68, 56, .7); font-size: 14px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="flower" aria-hidden="true">🌸</div>
      <h1>正在取得最新版本</h1>
      <p>完成後會自動回到 Sweet Home，家庭資料不會被清除。</p>
    </main>
    <script>
      (async () => {
        try {
          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names.map((name) => caches.delete(name)));
          }
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
        } finally {
          const target = new URL('./', window.location.href);
          target.searchParams.set('recovery', Date.now().toString());
          window.location.replace(target.toString());
        }
      })();
    </script>
  </body>
</html>
