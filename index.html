<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>家庭積分系統</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nook: {
                cream: '#F8FBF5',  /* 霧白內容面 */
                beige: '#EAF2E5',  /* 葉影底色 */
                brown: '#394438',  /* 墨綠灰主文字 */
                green: '#64B96A',  /* 嫩芽綠 */
                greenDark: '#2C7A4B',
                blue: '#65B7D9',   /* 露水藍 */
                blueDark: '#3282A5',
                orange: '#F0A24A', /* 花蜜橘 */
                orangeDark: '#B96828',
                yellow: '#F6D96B', /* 花心黃 */
                red: '#E76F67',
                paper: '#FFFFFF',
              }
            },
            fontFamily: {
              sans: ['"Varela Round"', '"Zen Maru Gothic"', 'ui-rounded', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* 隱藏滾動條 */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      body {
        background-color: #EDF5E8;
        color: #394438;
      }

      /* Pikmin Bloom 風格：清爽草地與天空色調，不使用高噪音紋理。 */
      .app-bg {
        background:
          radial-gradient(circle at 8% 6%, rgba(246, 217, 107, 0.18), transparent 18rem),
          radial-gradient(circle at 92% 12%, rgba(101, 183, 217, 0.16), transparent 20rem),
          linear-gradient(180deg, #F6FAF3 0%, #EDF5E8 100%);
        background-attachment: fixed;
      }

      /* 卡片以緊湊、低浮起感為主。 */
      .soft-card {
        box-shadow: 0 4px 8px -4px rgba(44, 122, 75, 0.22);
      }

      /* 花朵輕微搖擺 */
      @keyframes sway {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
      }
      .animate-sway { animation: sway 5s ease-in-out infinite; transform-origin: 50% 78%; }
      @media (prefers-reduced-motion: reduce) {
        .animate-sway { animation: none; }
      }

      /* 登入與角色頁面的柔和花園底色。 */
      .leaf-pattern {
        background:
          radial-gradient(circle at 18% 16%, rgba(246, 217, 107, 0.24), transparent 13rem),
          radial-gradient(circle at 86% 82%, rgba(101, 183, 217, 0.2), transparent 15rem),
          #EDF5E8;
      }
      
      /* 彈出動畫效果 */
      @keyframes popIn {
        0% { transform: translateY(4px); }
        100% { transform: translateY(0); }
      }
      .animate-pop {
        animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* iPhone 安全區域支援 */
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 8px);
      }

      /* Safari 會使用較長的本地化日期文字；縮小內部留白以維持手機雙欄。 */
      .compact-date-input::-webkit-date-and-time-value {
        min-width: 0;
        margin: 0;
        text-align: left;
      }
      .compact-date-input::-webkit-datetime-edit {
        min-width: 0;
        padding: 0;
      }
      .compact-date-input::-webkit-calendar-picker-indicator {
        width: 16px;
        height: 16px;
        margin-left: 2px;
        padding: 1px;
        flex: 0 0 auto;
      }

      /* 自訂捲軸 */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(107,91,73,0.15); border-radius: 999px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(107,91,73,0.3); }
    </style>
  <script type="module" crossorigin src="/Familypoints-Pages/assets/index-Bhz_iZFj.js"></script>
</head>
  <body class="bg-nook-beige text-nook-brown antialiased select-none font-sans h-full">
    <div id="root" class="h-full"></div>
</body>
</html>
