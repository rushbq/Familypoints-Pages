<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>家庭積分系統</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0D1424" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="家庭積分" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              /* 戰鬥陀螺・競技場（STADIUM）配色
                 深藍鋼為場地、青色為主隊色、橘色為對手隊色、螢光綠為爆點。 */
              bey: {
                void: '#05080F',      /* 遮罩與最深層 */
                deep: '#0D1424',      /* 競技場地板（整體背景） */
                panel: '#16213A',     /* 一般面板 */
                paper: '#1D2B4D',     /* 浮起面板／輸入框 */
                steel: '#2C3B60',     /* 金屬邊框 */
                dim: '#9FB3D9',       /* 次要文字 */
                ink: '#E6EEFB',       /* 主要文字 */
                cyan: '#13FFF3',      /* 系統主色：作用中、確認、焦點。不作為隊色 */
                cyanDark: '#0A9C95',
                blue: '#3BA7F0',      /* 導覽・資訊 */
                blueDark: '#0F5E96',
                purple: '#D47CFF',    /* 隊色一（丞鈞）。亮度對齊 orange，兩個孩子視覺對等 */
                purpleDark: '#7D1FB0',
                orange: '#FF7A2F',    /* 隊色二（佑佑）・獎勵兌換 */
                orangeDark: '#A8441A',
                yellow: '#FCEE21',    /* 冠軍・星等 */
                red: '#FF6B6B',       /* 扣分・危險。#FF4D4D 在 bey-paper 上只有 4.27 */
                lime: '#A2FF1F',      /* 爆發強調 */
              }
            },
            fontFamily: {
              sans: ['"Chakra Petch"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
              display: ['Orbitron', '"Chakra Petch"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      /* 文字可以選取（家長要複製備註／帳號），但按鈕與導覽不給選，
         避免小孩長按時整塊反白。 */
      button, a, [role="tab"], nav, label { -webkit-user-select: none; user-select: none; }

      /* 隱藏滾動條 */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      body {
        background-color: #0D1424;
        color: #E6EEFB;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      /* 數字與標題使用寬體科技感字型，並稍微拉開字距。 */
      .font-display { letter-spacing: 0.04em; }

      /* ===== 競技場背景 ===== */
      /* 投射燈（青／橘）＋同心圓場地線＋金屬格紋。 */
      .app-bg {
        background:
          radial-gradient(circle at 12% 4%, rgba(19, 255, 243, 0.14), transparent 22rem),
          radial-gradient(circle at 88% 10%, rgba(255, 122, 47, 0.12), transparent 24rem),
          linear-gradient(180deg, #121D33 0%, #0D1424 55%, #080E1A 100%);
        background-attachment: fixed;
      }

      /* 登入／角色選擇：正對競技場中心的發射台視角。 */
      .arena-pattern {
        position: relative;
        background:
          radial-gradient(circle at 50% 42%, rgba(19, 255, 243, 0.16), transparent 20rem),
          radial-gradient(circle at 50% 108%, rgba(255, 122, 47, 0.14), transparent 22rem),
          linear-gradient(180deg, #131F38 0%, #0D1424 60%, #070C16 100%);
      }
      /* 場地同心圓：用 repeating-radial-gradient 畫出賽場刻線。 */
      .arena-pattern::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-radial-gradient(circle at 50% 42%,
            transparent 0 46px,
            rgba(19, 255, 243, 0.08) 46px 47px);
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
      }

      /* 可重複使用的競技場刻線層，給首頁英雄區當底。 */
      .arena-rings {
        background:
          repeating-radial-gradient(circle at var(--rings-x, 50%) var(--rings-y, 50%),
            transparent 0 28px,
            rgba(19, 255, 243, 0.10) 28px 29px);
        mask-image: radial-gradient(circle at var(--rings-x, 50%) var(--rings-y, 50%), #000 10%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at var(--rings-x, 50%) var(--rings-y, 50%), #000 10%, transparent 70%);
      }

      /* 速度線：斜向掃過的加速軌跡。 */
      .speed-lines {
        background: repeating-linear-gradient(115deg,
          transparent 0 16px,
          rgba(230, 238, 251, 0.045) 16px 18px);
      }

      /* 卡片：深色金屬面板，靠邊框而非陰影分層。 */
      .soft-card {
        border: 1px solid rgba(44, 59, 96, 0.9);
        box-shadow:
          0 10px 24px -14px rgba(0, 0, 0, 0.85),
          inset 0 1px 0 rgba(230, 238, 251, 0.05);
      }

      /* 斜切角：競技場 HUD 的招牌輪廓。 */
      .clip-notch {
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      }
      .clip-notch-sm {
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      }

      /* 發光文字，給分數用。 */
      .glow-cyan { text-shadow: 0 0 18px rgba(19, 255, 243, 0.45); }
      .glow-orange { text-shadow: 0 0 18px rgba(255, 122, 47, 0.45); }
      .glow-purple { text-shadow: 0 0 18px rgba(212, 124, 255, 0.5); }

      /* ===== 陀螺旋轉 ===== */
      @keyframes beySpin { to { transform: rotate(360deg); } }
      .bey-spin { animation: beySpin 2.6s linear infinite; transform-origin: 50% 50%; }
      .bey-spin-fast { animation: beySpin 0.9s linear infinite; transform-origin: 50% 50%; }
      /* 發射：像拉繩彈出去，衝一下之後自己慢下來停住。
         等速 linear 是機械，有加速度才像物體。終點是 360 的倍數，所以停在原角度。 */
      @keyframes beyLaunch { to { transform: rotate(1080deg); } }
      .bey-launch {
        animation: beyLaunch 2.4s cubic-bezier(0.08, 0.62, 0.2, 1) both;
        transform-origin: 50% 50%;
      }
      /* 陀螺在場上游走時的輕微晃動。 */
      @keyframes beyWobble {
        0%, 100% { transform: translate(0, 0) rotate(-2deg); }
        50% { transform: translate(2px, -3px) rotate(2deg); }
      }
      .bey-wobble { animation: beyWobble 3.2s ease-in-out infinite; }

      /* ===== 鍛造與對戰動畫 ===== */

      /* 揭曉與撞擊的白閃 */
      @keyframes beyFlash {
        0% { opacity: 0; }
        30% { opacity: 0.8; }
        100% { opacity: 0; }
      }
      .bey-flash { animation: beyFlash 0.34s ease-out both; }

      /* 命中時整塊震一下；爆冷用 hard 版本震得更久 */
      @keyframes beyImpact {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-5px, 2px); }
        40% { transform: translate(4px, -3px); }
        60% { transform: translate(-3px, 1px); }
        80% { transform: translate(2px, 0); }
      }
      .bey-impact { animation: beyImpact 0.38s ease-in-out both; }
      .bey-impact-hard { animation: beyImpact 0.4s ease-in-out 2 both; }

      /* 稀有零件、組裝完成、撞擊時擴散出去的環 */
      @keyframes beyShockwave {
        0% { transform: scale(0.35); opacity: 0.9; }
        100% { transform: scale(2.1); opacity: 0; }
      }
      .bey-shockwave { animation: beyShockwave 0.72s ease-out both; }

      /* 鍛造爐蓄力：爐心由暗轉亮 */
      @keyframes beyCharge {
        0% { transform: scale(0.88); opacity: 0.4; }
        70% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(1.02); opacity: 1; }
      }
      .bey-charge { animation: beyCharge 0.7s ease-in both; }

      /* 零件飛入組裝台 */
      @keyframes beyPartFlyIn {
        0% { transform: translateX(26px) scale(0.8); opacity: 0; }
        70% { transform: translateX(0) scale(1.06); opacity: 1; }
        100% { transform: translateX(0) scale(1); opacity: 1; }
      }
      .bey-part-fly { animation: beyPartFlyIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both; }

      /* 組裝完成：陀螺縮放登場 */
      @keyframes beyAssembleIn {
        0% { transform: scale(0.45); opacity: 0; }
        60% { transform: scale(1.12); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .bey-assemble-in { animation: beyAssembleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

      /* 重複零件退鋼料：數字往上飄走，不給慶祝 */
      @keyframes beyFloatUp {
        0% { transform: translateY(6px); opacity: 0; }
        25% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-26px); opacity: 0; }
      }
      .bey-float-up { animation: beyFloatUp 1.1s ease-out both; }

      /* 開戰出場：兩軍從左右滑入 */
      @keyframes beyEnterLeft {
        0% { transform: translateX(-56px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes beyEnterRight {
        0% { transform: translateX(56px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      .bey-enter-left { animation: beyEnterLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .bey-enter-right { animation: beyEnterRight 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }

      /* 回合落敗的一方被震退 */
      @keyframes beyRecoilLeft {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        35% { transform: translateX(-14px) rotate(-10deg); }
      }
      @keyframes beyRecoilRight {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        35% { transform: translateX(14px) rotate(10deg); }
      }
      .bey-recoil-left { animation: beyRecoilLeft 0.44s ease-out both; }
      .bey-recoil-right { animation: beyRecoilRight 0.44s ease-out both; }

      /* 收尾：敗方傾倒停轉 */
      @keyframes beyTopple {
        0% { transform: rotate(0deg) translateY(0); opacity: 1; }
        45% { transform: rotate(-38deg) translateY(6px); opacity: 1; }
        100% { transform: rotate(-74deg) translateY(16px); opacity: 0.3; }
      }
      .bey-topple {
        animation: beyTopple 0.9s cubic-bezier(0.45, 0, 0.75, 0.45) both;
        transform-origin: 50% 85%;
      }

      /* 花朵輕微搖擺（花園沿用） */
      @keyframes sway {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
      }
      .animate-sway { animation: sway 5s ease-in-out infinite; transform-origin: 50% 78%; }
      @media (prefers-reduced-motion: reduce) {
        .animate-sway { animation: none; }
      }

      /* 彈出動畫效果 */
      @keyframes popIn {
        0% { transform: translateY(4px); }
        100% { transform: translateY(0); }
      }
      .animate-pop {
        animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* 植物長大：帶一點回彈，讓每次澆水都看得出變化 */
      @keyframes gardenGrow {
        0% { opacity: 0.6; transform: translateY(10px) scale(0.9); }
        55% { opacity: 1; transform: translateY(-5px) scale(1.055); }
        78% { transform: translateY(1px) scale(0.985); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      .garden-plant-stage {
        animation: gardenGrow 0.62s cubic-bezier(0.22, 1, 0.36, 1) both;
        transform-origin: 50% 92%;
      }

      /* ===== 澆水互動動畫 ===== */

      /* 灑水壺滑入、傾倒、再收回 */
      @keyframes gardenCan {
        0% { transform: translate(52px, -40px) rotate(8deg); opacity: 0; }
        16% { transform: translate(0, 0) rotate(8deg); opacity: 1; }
        30% { transform: translate(0, 0) rotate(-34deg); opacity: 1; }
        78% { transform: translate(0, 0) rotate(-34deg); opacity: 1; }
        90% { transform: translate(0, 0) rotate(8deg); opacity: 1; }
        100% { transform: translate(52px, -40px) rotate(8deg); opacity: 0; }
      }
      .garden-can {
        animation: gardenCan 1.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        transform-origin: 78% 62%;
      }

      /* 水滴落下：終點用百分比，才能跟著不同階段的舞台高度自動調整 */
      @keyframes gardenDrop {
        0% { top: 0%; transform: scaleY(0.6); opacity: 0; }
        15% { opacity: 1; }
        80% { opacity: 1; }
        100% { top: var(--drop-end, 100%); transform: scaleY(1.35); opacity: 0; }
      }
      .garden-drop {
        animation: gardenDrop 0.58s cubic-bezier(0.45, 0, 0.75, 0.45) both;
      }

      /* 水花在土面擴散 */
      @keyframes gardenSplash {
        0% { transform: translateX(-50%) scale(0.25); opacity: 0.85; }
        100% { transform: translateX(-50%) scale(1.8); opacity: 0; }
      }
      .garden-splash {
        animation: gardenSplash 0.7s ease-out both;
      }

      /* 閃亮亮的小星星 */
      @keyframes gardenSparkle {
        0% { transform: scale(0.2); opacity: 0; }
        40% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(0.5) translateY(-28px); opacity: 0; }
      }
      .garden-sparkle {
        animation: gardenSparkle 1s ease-out both;
      }

      /* 摸摸看植物時的搖擺 */
      @keyframes gardenWiggle {
        0%, 100% { transform: rotate(0deg); }
        22% { transform: rotate(-3.5deg); }
        48% { transform: rotate(3deg); }
        74% { transform: rotate(-1.5deg); }
      }
      .garden-wiggle {
        animation: gardenWiggle 0.6s ease-in-out both;
        transform-origin: 50% 92%;
      }

      /* 開花慶祝：花瓣飄落 */
      @keyframes gardenPetalFall {
        0% { transform: translate3d(0, -20px, 0) rotate(0deg); opacity: 0; }
        12% { opacity: 1; }
        100% { transform: translate3d(var(--petal-x, 0px), 300px, 0) rotate(460deg); opacity: 0; }
      }
      .garden-petal {
        animation: gardenPetalFall 2.4s ease-in both;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* iPhone 安全區域支援 */
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 8px);
      }

      /* 深色底下的日期欄位需要反轉原生控制項色彩。 */
      .compact-date-input {
        color-scheme: dark;
      }
      .compact-date-input::-webkit-date-and-time-value {
        min-width: 0;
        margin: 0;
        text-align: left;
      }
      .compact-date-input::-webkit-datetime-edit {
        min-width: 0;
        padding: 0;
      }
      .compact-date-input::-webkit-calendar-picker-indicator {
        width: 16px;
        height: 16px;
        margin-left: 2px;
        padding: 1px;
        flex: 0 0 auto;
        filter: invert(1);
      }

      /* 自訂捲軸 */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(19,255,243,0.18); border-radius: 999px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(19,255,243,0.35); }
    </style>
</head>
  <body class="bg-bey-deep text-bey-ink antialiased font-sans h-full">
    <div id="root" class="h-full"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
